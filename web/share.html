<!doctype html>
<!-- 独立分享页：公开配置直接展示链接，有密码的接口先验证。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分享配置 · VodPlus</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/share.js"></script></head><body><main class="auth"><div class="wordmark" id="share-brand"></div><h1 id="share-name">分享配置</h1><p id="share-description">正在读取接口信息…</p><form id="unlock" hidden><label>访问密码<input name="password" type="password" minlength="5" required autocomplete="current-password" placeholder="输入分享密码"></label><p id="error" class="error-text" role="alert" hidden></p><button class="primary">获取配置链接</button></form><div id="result" hidden><label>配置链接<textarea id="url" rows="4" readonly></textarea></label><button id="copy" class="primary">复制配置链接</button><small>永久有效，可粘贴到 App 的点播配置中使用。</small></div><small>VodPlus Sync · 配置分享</small></main><div id="toast" role="status"></div><dialog id="modal"></dialog></body></html>
